name: Bug report
description: Report something that behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more precise the details, the faster the fix.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add desktop ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - Same LAN / Wi-Fi
        - Tailscale
        - Other VPN
        - Not sure
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version & device
      placeholder: e.g. Android 14, Pixel 7
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CodeCockpit Remote version
      description: Shown by your APK installer or the version tag you installed
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: CodeCockpit desktop version
      description: Shown in the desktop app under Settings → About
      placeholder: e.g. 1.3.0
  - type: input
    id: cli
    attributes:
      label: CLI engine involved
      description: claude / codex / opencode — whichever session you were watching
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a short screen recording (redact pairing secrets, tokens, and fingerprints before pasting anything).
