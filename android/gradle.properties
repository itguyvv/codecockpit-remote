# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project: "official" version
kotlin.code.style=official
# Only build the Android variant of the libraries used (faster configuration)
android.nonTransitiveRClass=true

# The repository lives under a non-ASCII path on the maintainer's machine; CI paths are ASCII
android.overridePathCheck=true
